name: Vidhwaan Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        step: [download, extract, segment, generate]

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: |
          if [ "${{ matrix.step }}" = "download" ]; then python scripts/download_ncert.py; fi
          if [ "${{ matrix.step }}" = "extract" ]; then python scripts/extract_text.py; fi
          if [ "${{ matrix.step }}" = "segment" ]; then python scripts/segment_topics.py; fi
          if [ "${{ matrix.step }}" = "generate" ]; then python scripts/generate_engine.py; fi

      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@vidhwaan.com"
          git add .
          git commit -m "Auto build" || echo "No changes"
          git push
