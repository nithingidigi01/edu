name: Vidhwaan Global Education Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout Repo
        uses: actions/checkout@v3

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # -----------------------------
      # CACHE (VERY IMPORTANT)
      # -----------------------------
      - name: Cache HuggingFace Models
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: hf-cache

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # STEP 1 — DOWNLOAD
      # -----------------------------
      - name: Download NCERT
        run: python scripts/download_ncert.py

      # -----------------------------
      # STEP 2 — EXTRACT TEXT
      # -----------------------------
      - name: Extract Text
        run: python scripts/extract_text.py

      # -----------------------------
      # STEP 3 — SEGMENT TOPICS
      # -----------------------------
      - name: Segment Topics
        run: python scripts/segment_topics.py

      # -----------------------------
      # STEP 4 — GENERATE MCQs
      # -----------------------------
      - name: Generate MCQs
        run: python scripts/generate_engine.py

      # -----------------------------
      # STEP 5 — ADVANCED ENGINE
      # -----------------------------
      - name: Advanced MCQs
        run: python scripts/advanced_engine.py

      # -----------------------------
      # COMMIT OUTPUT
      # -----------------------------
      - name: Commit Results
        run: |
          git config --global user.name "vidhwaan-bot"
          git config --global user.email "bot@vidhwaan.com"

          git add .

          git commit -m "🚀 Auto Generated NCERT MCQs" || echo "No changes"

          git push
