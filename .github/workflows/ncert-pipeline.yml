name: Vidhwaan Global Education Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # -----------------------------
      # CACHE PIP (FASTER INSTALL)
      # -----------------------------
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      # -----------------------------
      # CACHE HUGGINGFACE MODELS
      # -----------------------------
      - name: Cache HuggingFace
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # VERIFY INSTALL (DEBUG SAFE)
      # -----------------------------
      - name: Verify PyMuPDF
        run: python -c "import fitz; print('PyMuPDF OK')"

      # -----------------------------
      # PREPARE DIRECTORIES
      # -----------------------------
      - name: Prepare Folders
        run: |
          mkdir -p raw_ncert
          mkdir -p processed_text
          mkdir -p data/ncert

      # -----------------------------
      # DOWNLOAD NCERT
      # -----------------------------
      - name: Download NCERT
        run: python scripts/download_ncert.py

      # -----------------------------
      # EXTRACT TEXT (FIXED ENGINE)
      # -----------------------------
      - name: Extract Text
        run: python scripts/extract_text.py

      # -----------------------------
      # SEGMENT TOPICS
      # -----------------------------
      - name: Segment Topics
        run: python scripts/segment_topics.py

      # -----------------------------
      # GENERATE MCQs
      # -----------------------------
      - name: Generate MCQs
        run: python scripts/generate_engine.py

      # -----------------------------
      # ADVANCED MCQs
      # -----------------------------
      - name: Advanced MCQs
        run: python scripts/advanced_engine.py

      # -----------------------------
      # CLEAN TEMP (SAFE)
      # -----------------------------
      - name: Cleanup Temp
        run: |
          rm -rf /tmp/* || true

      # -----------------------------
      # COMMIT RESULTS
      # -----------------------------
      - name: Commit & Push
        run: |
          git config --global user.name "vidhwaan-bot"
          git config --global user.email "bot@vidhwaan.com"

          git add .

          git commit -m "🚀 Auto Generated NCERT Data" || echo "No changes"

          git push
