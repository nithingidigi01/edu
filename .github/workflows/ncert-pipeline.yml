name: Vidhwaan Class 6 MCQ Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # SETUP PYTHON
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # CACHE PIP
      # -----------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements.txt') }}

      # -----------------------------
      # CACHE HF MODELS
      # -----------------------------
      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # VERIFY PyMuPDF
      # -----------------------------
      - name: Verify PyMuPDF
        run: python -c "import fitz; print('PyMuPDF OK')"

      # -----------------------------
      # PREPARE FOLDERS
      # -----------------------------
      - name: Prepare folders
        run: |
          mkdir -p processed_text
          mkdir -p data/ncert

      # -----------------------------
      # EXTRACT TEXT (SAFE VERSION)
      # -----------------------------
      - name: Extract Text
        run: python scripts/extract_text.py

      # -----------------------------
      # SEGMENT TOPICS
      # -----------------------------
      - name: Segment Topics
        run: python scripts/segment_topics.py

      # -----------------------------
      # GENERATE MCQs
      # -----------------------------
      - name: Generate MCQs
        run: python scripts/generate_engine.py

      # -----------------------------
      # DEBUG OUTPUT
      # -----------------------------
      - name: Show output structure
        run: |
          echo "===== GENERATED FILES ====="
          find data/ncert/class6 -type f | head -n 50 || true

      # -----------------------------
      # COMMIT RESULTS
      # -----------------------------
      - name: Commit & Push
        run: |
          git config --global user.name "vidhwaan-bot"
          git config --global user.email "bot@vidhwaan.com"

          git pull origin main --rebase || true

          git add data processed_text

          git commit -m "🚀 Class 6 MCQs Generated" || echo "No changes"

          git push
