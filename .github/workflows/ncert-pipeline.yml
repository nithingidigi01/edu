name: UPSC Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Extract Text
        run: python scripts/extract_text.py

      - name: Segment Topics
        run: python scripts/segment_topics.py

      - name: Generate MCQs
        run: python scripts/generate_mcqs.py

      - name: Commit Results
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@vidhwaan.com"
          git add .
          git commit -m "Auto generated UPSC data" || echo "No changes"
          git push
