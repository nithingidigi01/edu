name: Vidhwaan Global Education Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # runs daily (optional)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3

      # -----------------------------
      # SETUP PYTHON
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # -----------------------------
      # CACHE PIP (FASTER INSTALL)
      # -----------------------------
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-cache

      # -----------------------------
      # CACHE HF MODELS (CRITICAL)
      # -----------------------------
      - name: Cache HuggingFace
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: hf-cache

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # CREATE REQUIRED DIRS
      # -----------------------------
      - name: Prepare Directories
        run: |
          mkdir -p raw_ncert
          mkdir -p processed_text
          mkdir -p data/ncert

      # -----------------------------
      # DOWNLOAD NCERT (PARALLEL)
      # -----------------------------
      - name: Download NCERT
        run: python scripts/download_ncert.py

      # -----------------------------
      # EXTRACT TEXT
      # -----------------------------
      - name: Extract Text
        run: python scripts/extract_text.py

      # -----------------------------
      # SEGMENT TOPICS
      # -----------------------------
      - name: Segment Topics
        run: python scripts/segment_topics.py

      # -----------------------------
      # GENERATE MCQs
      # -----------------------------
      - name: Generate MCQs
        run: python scripts/generate_engine.py

      # -----------------------------
      # ADVANCED ENGINE
      # -----------------------------
      - name: Advanced MCQs
        run: python scripts/advanced_engine.py

      # -----------------------------
      # CLEAN TEMP CACHE (OPTIONAL)
      # -----------------------------
      - name: Cleanup Cache (optional)
        run: |
          rm -rf /tmp/* || true

      # -----------------------------
      # COMMIT RESULTS
      # -----------------------------
      - name: Commit & Push
        run: |
          git config --global user.name "vidhwaan-bot"
          git config --global user.email "bot@vidhwaan.com"

          git add .

          git commit -m "🚀 Auto Generated NCERT Engine" || echo "No changes"

          git push
